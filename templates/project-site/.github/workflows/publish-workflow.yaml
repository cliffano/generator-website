---
name: Publish
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          token: $\{{ secrets.{{github_token_prefix}}_GITHUB_TOKEN }}
          set-safe-directory: $\{{ github.workspace }}
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          command: 'make deps build'
          image: cliffano/studio:4.0.0
      - uses: cliffano/save-changes-action@main
        with:
          message: "Generate website on $(date +'%d/%m/%Y %H:%M:%S')"
          github_token: $\{{ secrets.{{github_token_prefix}}_GITHUB_TOKEN }}
